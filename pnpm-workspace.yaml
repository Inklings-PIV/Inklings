allowBuilds:
  '@vaadin/vaadin-usage-statistics': false  # deck.gl telemetry, harmless to skip
  esbuild: true                              # native binary; needed by tsx / vitest / drizzle-kit
  protobufjs: false                          # opentelemetry, harmless to skip
  sharp: true                                # native binary; needed by Next.js image optimisation

ignoredBuiltDependencies:
  - unrs-resolver

# Exact releases selected during the 2026-10-21 update, added by pnpm's age gate.
# Keep its default protection for all other versions.
minimumReleaseAgeExclude:
  - '@ai-sdk/anthropic@4.0.84'
  - '@ai-sdk/gateway@4.0.120'
  - '@ai-sdk/openai@4.0.98'
  - '@ai-sdk/provider-utils@5.0.64'
  - '@ai-sdk/provider@4.0.31'
  - ai@7.0.147
  - lucide-react@1.60.0

overrides:
  esbuild: '^0.28.2'
  postcss: '^8.5.31'
  # loaders.gl still pins 0.7.4; 0.7.5 fixes malformed ZIP64 input handling.
  fflate@0.7.4: 0.7.5
